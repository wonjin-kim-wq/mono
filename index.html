<!doctype html>
<html lang="ko">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#f7f7f5"><title>mono — Find your frequency.</title><link rel="stylesheet" href="/style.css"></head>
<body>
<aside class="sidebar">
  <a href="#discover" data-page="discover" class="brand" aria-label="mono 홈"><span class="brand-symbol"><i></i><i></i><i></i><i></i></span>mono<span class="brand-dot">.</span></a>
  <div class="workspace-label">YOUR SOUND, YOUR SPACE</div>
  <nav><button class="nav-item active" data-page="discover"><span data-icon="compass"></span>둘러보기<span class="nav-dot"></span></button><button class="nav-item" data-page="search"><span data-icon="search"></span>노래 검색</button><button class="nav-item" data-page="upload"><span data-icon="upload"></span>노래 업로드</button><button class="nav-item" data-page="board"><span data-icon="message"></span>문의게시판</button></nav>
  <div class="library-label">MY LIBRARY</div><button class="nav-item" data-page="likes"><span data-icon="heart"></span>좋아요한 음악<span class="count" id="likeCount">0</span></button><button class="nav-item" data-page="myuploads"><span data-icon="music"></span>내가 올린 음악<span class="count" id="uploadCount">0</span></button>
  <div class="sidebar-bottom"><div class="small-promo"><div class="promo-icon" data-icon="headphones"></div><strong>당신의 음악이 시작되는 곳.</strong><p>발견하고, 나누고, 연결하세요.</p><button data-page="upload">첫 음악 업로드하기 <span>↗</span></button></div><div class="profile"><div class="avatar">M</div><div><strong>Music lover</strong><small>Personal account</small></div><span class="profile-more">···</span></div></div>
</aside>
<div class="app-shell"><header><div class="header-location">Music, in your own way.</div><div class="header-actions"><label class="search-box"><span data-icon="search"></span><input id="globalSearch" placeholder="어떤 음악을 찾고 있나요?" aria-label="음악 검색"><kbd>⌘ K</kbd></label><button class="icon-button notification" id="notificationButton" aria-label="알림"><span data-icon="bell"></span><b></b></button><div class="header-avatar">M</div></div></header><main id="main"></main><footer><span>© 2026 mono. All sounds welcome.</span><span>Made for the love of music. <span class="footer-mark">✳</span></span></footer></div>
<div class="key-dock" aria-label="현재 곡 키 조절"><button class="dock-track" id="openKeyPanel"><span data-icon="music"></span><span>키 조절</span><small data-key-summary>남자 · 원키</small></button><div class="dock-controls"><div class="voice-toggle compact" role="group" aria-label="남자 여자 키 선택"><button data-voice="male" aria-pressed="true">남자</button><button data-voice="female" aria-pressed="false">여자</button></div><button class="dock-step" data-key-step="-1" aria-label="키 한 단계 내리기">−</button><output data-key-output aria-live="polite">0</output><button class="dock-step" data-key-step="1" aria-label="키 한 단계 올리기">+</button><button class="dock-reset" data-key-reset>초기화</button></div></div><section class="player" aria-label="음악 플레이어"><div class="now-playing"><img id="playerCover" alt="현재 곡 앨범"/><div><strong id="playerTitle">음악을 선택해 주세요</strong><span id="playerArtist">당신만의 주파수를 찾아보세요</span></div><button class="icon-button" id="playerLike" aria-label="현재 곡 좋아요"><span data-icon="heart"></span></button></div><div class="playback"><div class="playback-buttons"><button class="icon-button" id="shuffle" aria-label="셔플"><span data-icon="shuffle"></span></button><button class="icon-button" id="prev" aria-label="이전 곡"><span data-icon="prev"></span></button><button class="play-main" id="playPause" aria-label="재생"><span data-icon="play"></span></button><button class="icon-button" id="next" aria-label="다음 곡"><span data-icon="next"></span></button><button class="icon-button" id="repeat" aria-label="반복"><span data-icon="repeat"></span></button></div><div class="timeline"><span id="elapsed">0:00</span><input id="progress" type="range" min="0" max="100" value="0" aria-label="재생 위치"><span id="duration">0:00</span></div></div><div class="volume-control"><span class="quality">HIGH QUALITY</span><span data-icon="volume"></span><input id="volume" type="range" min="0" max="1" step="0.01" value="0.65" aria-label="음량"><button class="icon-button" id="queue" aria-label="재생목록"><span data-icon="list"></span></button></div><audio id="audio" preload="metadata"></audio></section>
<div class="toast" id="toast" role="status"></div><dialog id="modal"><div id="modalContent"></div></dialog><script type="module" src="/app.js"></script>
</body></html>
